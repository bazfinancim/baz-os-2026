name: Deploy to Hetzner

on:
  push:
    branches:
      - main
      - golden-empire-final
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy via SSH password
        env:
          SSH_PASS: Bazz2026!
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no root@178.105.75.214 "
            echo Deploy Started &&
            cd /var/www/baz-panel &&
            git fetch origin &&
            git reset --hard origin/golden-empire-final &&
            npm ci --prefer-offline 2>&1 | tail -3 &&
            npm run build 2>&1 | tail -5 &&
            pm2 restart baz-panel &&
            pm2 save &&
            echo DEPLOY_DONE
          "
